$font = FiraCode Nerd Font Mono

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $HOME/.config/assets/Wallpapers/catppuccin-mocha/Cloudy_Quasar_1-Catppuccin_Mocha.png
    color = rgba(1e1e2eee) # base
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(b4befeee) rgba(b4befeee) 45deg # lavender
    check_color = rgba(34F86Cee) rgba(B5FFE2) 120deg # neon green and mint
    fail_color = rgba(FF5277ee) rgba(f38ba8ee) 40deg # neon red and red

    font_color = rgba(cdd6f4ee) # text
    fade_on_empty = false
    rounding = 6

    font_family = $font
    placeholder_text = Contraseña...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    check_text = Autenticando...

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = 
    dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font

    position = 0, 20%
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 18
    font_family = $font

    position = 0, 10%
    halign = center
    valign = center
}

# Image
image {
	monitor =
	path = $HOME/.config/assets/Characters/chibicat-laptop.png
	size = 100
	position = -20%, 0
	halign = center
	valign = center
	border_size = 0
}
